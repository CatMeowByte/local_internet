<script>
 const $=id=>document.getElementById(id);
 const $q=(sel,ctx=document)=>ctx.querySelector(sel);
 const $qa=(sel,ctx=document)=>ctx.querySelectorAll(sel);
 const $on=(el,evt,fn)=>el.addEventListener(evt,fn);
 const $set=(el,key,val)=>el.style.setProperty(key,val);

 const tick_speed_regular = 500;
 const tick_speed_debug = 66;
 let tick_speed = tick_speed_regular;
 let debug_time_override = null;
 const tick_updates = [];
 let tick_last = 0;

 function tick_loop(timestamp) {
  if (timestamp - tick_last >= tick_speed) {
   tick_last = timestamp;
   tick_updates.forEach(fn => fn());
  }
  requestAnimationFrame(tick_loop);
 }

 requestAnimationFrame(tick_loop);

 function format_time(timestamp) {
  const date = new Date(timestamp);
  const hour = date.getHours();
  const minute = String(date.getMinutes()).padStart(2, '0');
  const display_hour = hour % 12 || 12;
  return `${display_hour}∶${minute} ${hour >= 12 ? 'PM' : 'AM'}`;
 }

 function format_relative(timestamp, current) {
  const diff_ms = Math.abs(timestamp - current);
  const diff_min = Math.floor(diff_ms / 60000);
  const direction = timestamp > current ? 'lagi' : 'lalu';

  if (diff_min >= 60) {
   const hours = Math.floor(diff_min / 60);
   return `${hours} jam ${direction}`;
  }
  return `${diff_min} menit ${direction}`;
 }

 function capitalize(str) {
  return str.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
 }

 const prayer_name_map = {
  fajr: 'Subuh',
  sunrise: 'Terbit',
  dhuhr: 'Dzuhur',
  asr: 'Ashar',
  sunset: 'Terbenam',
  maghrib: 'Maghrib',
  isha: 'Isya',
  midnight: 'Tengah Malam',
  last_third: 'Sepertiga Akhir'
 };

 const PRAYER_METHOD = {
  MWL: { fajr: 18, isha: 17, maghrib: 0, midnight_jafari: false },
  ISNA: { fajr: 15, isha: 15, maghrib: 0, midnight_jafari: false },
  EGYPT: { fajr: 19.5, isha: 17.5, maghrib: 0, midnight_jafari: false },
  MAKKAH: { fajr: 18.5, isha: 90, maghrib: 0, midnight_jafari: false },
  KARACHI: { fajr: 18, isha: 18, maghrib: 0, midnight_jafari: false },
  TEHRAN: { fajr: 17.7, isha: 14, maghrib: 4.5, midnight_jafari: true },
  JAFARI: { fajr: 16, isha: 14, maghrib: 4, midnight_jafari: true },
  FRANCE: { fajr: 12, isha: 12, maghrib: 0, midnight_jafari: false },
  RUSSIA: { fajr: 16, isha: 15, maghrib: 0, midnight_jafari: false },
  SINGAPORE: { fajr: 20, isha: 18, maghrib: 0, midnight_jafari: false }
 };

 const ASR_METHOD = {
  STANDARD: 1,
  HANAFI: 2
 };

 const HIGHLAT_METHOD = {
  NIGHT_MIDDLE: 0,
  ONE_SEVENTH: 1,
  ANGLE_BASED: 2
 };

 const prayer_config = {
  lat: -6.2088,
  lng: 106.8456,
  method: PRAYER_METHOD.MWL,
  asr: ASR_METHOD.STANDARD,
  highlat: HIGHLAT_METHOD.NIGHT_MIDDLE,
  tune: {
   fajr: 0,
   dhuhr: 0,
   asr: 0,
   maghrib: 0,
   isha: 0,
  }
 };

 const hijri_config = {
  offset: 0
 };

 const chrono = (function(){
  const state = {
   timestamp: 0,
   second_independent: 0,
   time: { hour: 0, minute: 0, second: 0 },
   date: {
    g: { weekday: 0, day: 0, month: 0, year: 0 },
    h: { weekday: 0, day: 0, month: 0, year: 0 }
   },
   prayer: []
  };

  const dtr = d => d * Math.PI / 180;
  const rtd = r => r * 180 / Math.PI;
  const sin = d => Math.sin(dtr(d));
  const cos = d => Math.cos(dtr(d));
  const tan = d => Math.tan(dtr(d));
  const arcsin = d => rtd(Math.asin(d));
  const arccos = d => rtd(Math.acos(d));
  const arccot = x => rtd(Math.atan(1 / x));
  const arctan2 = (y, x) => rtd(Math.atan2(y, x));
  const mod = (a, b) => ((a % b) + b) % b;
  const gmod = (n, m) => ((n % m) + m) % m;

  function calc_prayer_times(date) {
   const utc_time = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());

   const sun_position = (time_decimal) => {
    const D = utc_time / 864e5 - 10957.5 + time_decimal / 24 - prayer_config.lng / 360;
    const g = mod(357.529 + 0.98560028 * D, 360);
    const q = mod(280.459 + 0.98564736 * D, 360);
    const L = mod(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360);
    const e = 23.439 - 0.00000036 * D;
    const RA = mod(arctan2(cos(e) * sin(L), cos(L)) / 15, 24);

    return {
     declination: arcsin(sin(e) * sin(L)),
     equation: q / 15 - RA
    };
   };

   const mid_day = (time_decimal) => {
    const eqt = sun_position(time_decimal).equation;
    return mod(12 - eqt, 24);
   };

   const angle_time = (angle, time_decimal, direction = 1) => {
    const decl = sun_position(time_decimal).declination;
    const numerator = -sin(angle) - sin(prayer_config.lat) * sin(decl);
    const diff = arccos(numerator / (cos(prayer_config.lat) * cos(decl))) / 15;
    return mid_day(time_decimal) + diff * direction;
   };

   const asr_time = (time_decimal) => {
    const decl = sun_position(time_decimal).declination;
    const angle = -arccot(prayer_config.asr + tan(Math.abs(prayer_config.lat - decl)));
    return angle_time(angle, time_decimal);
   };

   const times = {
    fajr: angle_time(prayer_config.method.fajr, 5, -1),
    sunrise: angle_time(0.833, 6, -1),
    dhuhr: mid_day(12),
    asr: asr_time(13),
    sunset: angle_time(0.833, 18),
    maghrib: 0,
    isha: 0,
    midnight: 0
   };

   if (prayer_config.method.maghrib === 0) {
    times.maghrib = times.sunset;
   } else {
    times.maghrib = times.sunset + prayer_config.method.maghrib / 60;
   }

   if (prayer_config.method.isha >= 90) {
    times.isha = times.maghrib + prayer_config.method.isha / 60;
   } else {
    times.isha = angle_time(prayer_config.method.isha, 18);
   }

   if (prayer_config.method.midnight_jafari) {
    const next_fajr = angle_time(prayer_config.method.fajr, 29, -1) + 24;
    times.midnight = (times.sunset + next_fajr) / 2;
   } else {
    times.midnight = mid_day(12) + 12;
   }

   const night = 24 + times.sunrise - times.sunset;

   const adjust_time = (time, base, angle, direction = 1) => {
    let portion;
    if (prayer_config.highlat === HIGHLAT_METHOD.NIGHT_MIDDLE) {
     portion = night / 2;
    } else if (prayer_config.highlat === HIGHLAT_METHOD.ONE_SEVENTH) {
     portion = night / 7;
    } else if (prayer_config.highlat === HIGHLAT_METHOD.ANGLE_BASED) {
     portion = (angle / 60) * night;
    }

    const time_diff = (time - base) * direction;
    if (isNaN(time) || time_diff > portion) {
     return base + portion * direction;
    }
    return time;
   };

   times.fajr = adjust_time(times.fajr, times.sunrise, prayer_config.method.fajr, -1);
   times.isha = adjust_time(times.isha, times.sunset, prayer_config.method.isha, 1);
   times.maghrib = adjust_time(times.maghrib, times.sunset, prayer_config.method.maghrib, 1);

   for (let key in times) {
    times[key] += (prayer_config.tune[key] || 0) / 60;
   }

   for (let key in times) {
    const time_hour = times[key] - prayer_config.lng / 15;
    times[key] = utc_time + Math.floor(time_hour * 36e5);
   }

   return times;
  }

  function build_prayer_timeline(now) {
   const yesterday = new Date(now);
   yesterday.setDate(now.getDate() - 1);
   const tomorrow = new Date(now);
   tomorrow.setDate(now.getDate() + 1);
   const day_after_tomorrow = new Date(now);
   day_after_tomorrow.setDate(now.getDate() + 2);

   const times_yesterday = calc_prayer_times(yesterday);
   const times_today = calc_prayer_times(now);
   const times_tomorrow = calc_prayer_times(tomorrow);
   const times_day_after_tomorrow = calc_prayer_times(day_after_tomorrow);

   const calc_last_third = (sunset, next_fajr) => {
    const night_duration = next_fajr - sunset;
    return sunset + (2 * night_duration / 3);
   };

   const timeline = [
    { name: 'fajr', timestamp: times_yesterday.fajr, day: -1 },
    { name: 'sunrise', timestamp: times_yesterday.sunrise, day: -1 },
    { name: 'dhuhr', timestamp: times_yesterday.dhuhr, day: -1 },
    { name: 'asr', timestamp: times_yesterday.asr, day: -1 },
    { name: 'sunset', timestamp: times_yesterday.sunset, day: -1 },
    { name: 'maghrib', timestamp: times_yesterday.maghrib, day: -1 },
    { name: 'isha', timestamp: times_yesterday.isha, day: -1 },
    { name: 'midnight', timestamp: times_yesterday.midnight, day: -1 },
    { name: 'last_third', timestamp: calc_last_third(times_yesterday.sunset, times_today.fajr), day: -1 },
    { name: 'fajr', timestamp: times_today.fajr, day: 0 },
    { name: 'sunrise', timestamp: times_today.sunrise, day: 0 },
    { name: 'dhuhr', timestamp: times_today.dhuhr, day: 0 },
    { name: 'asr', timestamp: times_today.asr, day: 0 },
    { name: 'sunset', timestamp: times_today.sunset, day: 0 },
    { name: 'maghrib', timestamp: times_today.maghrib, day: 0 },
    { name: 'isha', timestamp: times_today.isha, day: 0 },
    { name: 'midnight', timestamp: times_today.midnight, day: 0 },
    { name: 'last_third', timestamp: calc_last_third(times_today.sunset, times_tomorrow.fajr), day: 0 },
    { name: 'fajr', timestamp: times_tomorrow.fajr, day: 1 },
    { name: 'sunrise', timestamp: times_tomorrow.sunrise, day: 1 },
    { name: 'dhuhr', timestamp: times_tomorrow.dhuhr, day: 1 },
    { name: 'asr', timestamp: times_tomorrow.asr, day: 1 },
    { name: 'sunset', timestamp: times_tomorrow.sunset, day: 1 },
    { name: 'maghrib', timestamp: times_tomorrow.maghrib, day: 1 },
    { name: 'isha', timestamp: times_tomorrow.isha, day: 1 },
    { name: 'midnight', timestamp: times_tomorrow.midnight, day: 1 },
    { name: 'last_third', timestamp: calc_last_third(times_tomorrow.sunset, times_day_after_tomorrow.fajr), day: 1 },
   ];

   return timeline;
  }

  function calc_hijri(now_timestamp, today_maghrib, offset) {
   const base_date = now_timestamp >= today_maghrib.timestamp
    ? new Date(now_timestamp + 86400000)
    : new Date(now_timestamp);

   if (offset) {
    base_date.setTime(base_date.getTime() + offset * 86400000);
   }

   let day = base_date.getDate();
   let month = base_date.getMonth();
   let year = base_date.getFullYear();
   let m = month + 1;
   let y = year;

   if (m < 3) {
    y -= 1;
    m += 12;
   }

   let a = Math.floor(y / 100);
   let b = 2 - a + Math.floor(a / 4);

   if (y < 1583) b = 0;
   if (y == 1582) {
    if (m > 10) b = -10;
    if (m == 10) {
     b = 0;
     if (day > 4) b = -10;
    }
   }

   let jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + b - 1524;

   b = 0;
   if (jd > 2299160) {
    a = Math.floor((jd - 1867216.25) / 36524.25);
    b = 1 + a - Math.floor(a / 4);
   }

   const bb = jd + b + 1524;
   const cc = Math.floor((bb - 122.1) / 365.25);
   const dd = Math.floor(365.25 * cc);
   const ee = Math.floor((bb - dd) / 30.6001);

   day = (bb - dd) - Math.floor(30.6001 * ee);
   month = ee - 1;
   if (ee > 13) {
    month = ee - 13;
   }
   year = cc - 4716;

   const wd = gmod(jd + 1 - (offset || 0), 7);

   const iyear = 10631 / 30;
   const epochastro = 1948084;
   const shift1 = 8.01 / 60;

   let z = jd - epochastro;
   const cyc = Math.floor(z / 10631);
   z = z - 10631 * cyc;
   const j = Math.floor((z - shift1) / iyear);
   const iy = 30 * cyc + j;
   z = z - Math.floor(j * iyear + shift1);
   let im = Math.floor((z + 28.5001) / 29.5);
   if (im == 13) im = 12;
   const id = z - Math.floor(29.5001 * im - 29);

   return {
    weekday: wd,
    day: id,
    month: im - 1,
    year: iy
   };
  }

  function update(){
   const now = new Date(debug_time_override ?? Date.now());

   state.timestamp = now.getTime();

   state.second_independent = new Date(Date.now()).getSeconds();

   state.time.hour = now.getHours();
   state.time.minute = now.getMinutes();
   state.time.second = now.getSeconds();

   state.date.g.weekday = now.getDay();
   state.date.g.day = now.getDate();
   state.date.g.month = now.getMonth();
   state.date.g.year = now.getFullYear();

   state.prayer = build_prayer_timeline(now);

   const hijri = calc_hijri(state.timestamp, state.prayer.find(p => p.name === 'maghrib' && p.day === 0), hijri_config.offset);
   state.date.h.weekday = hijri.weekday;
   state.date.h.day = hijri.day;
   state.date.h.month = hijri.month;
   state.date.h.year = hijri.year;
  }

  tick_updates.push(update);

  return state;
 })();

 (function clock(){
  const weekday_g_list = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const month_g_list = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const weekday_h_list = ['Ahad', 'Isnin', 'Selasa', "Rabu", 'Khamis', "Jumaat", 'Sabtu'];
  const month_h_list = ['Muharram', 'Safar', 'Rabiul Awal', 'Rabiul Akhir', 'Jumadil Awal', 'Jumadil Akhir', 'Rajab', 'Syakban', 'Ramadan', 'Syawal', 'Dzulkaidah', 'Dzulhijjah'];

  const hour_el = $q('.clock-time-hour');
  const minute_el = $q('.clock-time-minute');
  const separator_el = $q('.clock-time-separator');
  const meridiem_el = $q('.clock-time-meridiem');
  const gregorian_el = $q('.clock-date-gregorian');
  const hijri_el = $q('.clock-date-hijri');
  const current_el = $q('.clock-event-current');
  const current_name = current_el.children[0];
  const current_detail = current_el.children[1];
  const next_el = $q('.clock-event-next');
  const next_name = next_el.children[0];
  const next_detail = next_el.children[1];

  function update_clock(){
   let hour = chrono.time.hour;
   const minute = chrono.time.minute;
   const second = chrono.time.second;
   const meridiem = hour >= 12 ? 'PM' : 'AM';
   hour = hour % 12 || 12;

   hour_el.textContent = hour;
   minute_el.textContent = String(minute).padStart(2, '0');
   separator_el.style.opacity = second % 2 === 0 ? '1' : '0';
   meridiem_el.textContent = meridiem;

   const g_text = `${weekday_g_list[chrono.date.g.weekday]}, ${chrono.date.g.day} ${month_g_list[chrono.date.g.month]} ${chrono.date.g.year}`;
   const h_text = `${weekday_h_list[chrono.date.h.weekday]}, ${chrono.date.h.day} ${month_h_list[chrono.date.h.month]} ${chrono.date.h.year}`;
   gregorian_el.textContent = g_text;
   hijri_el.textContent = h_text;

   const skip_list = ['sunset', 'midnight'];
   const timeline = chrono.prayer.filter(event => !skip_list.includes(event.name));
   const current = chrono.timestamp;

   let previous = null;
   let next = null;

   for (let i = 0; i < timeline.length; i++) {
    if (timeline[i].timestamp <= current) {
     previous = timeline[i];
    } else if (!next) {
     next = timeline[i];
     break;
    }
   }

   if (previous) {
    current_name.textContent = prayer_name_map[previous.name];
    current_detail.textContent = `${format_time(previous.timestamp)} · ${format_relative(previous.timestamp, current)}`;
   }

   if (next) {
    next_name.textContent = prayer_name_map[next.name];
    next_detail.textContent = `${format_time(next.timestamp)} · ${format_relative(next.timestamp, current)}`;
   }
  }

  tick_updates.push(update_clock);
 })();

 (function schedule(){
  const main_prayers = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
  const prayer_items = $qa('.prayer-item');

  function update_schedule(){
   const timeline = chrono.prayer.filter(e => main_prayers.includes(e.name));
   const current = chrono.timestamp;
   const show_eta = chrono.second_independent % 10 < 5;

   let index = 0;
   for (let i = 0; i < timeline.length; i++) {
    if (timeline[i].timestamp <= current) {index = i;}
    else {break;}
   }

   const start = Math.max(0, index - 1);

   for (let i = 0; i < 5; i++) {
    const event = timeline[start + i];
    prayer_items[i].children[0].textContent = prayer_name_map[event.name];
    prayer_items[i].children[1].textContent = format_time(event.timestamp);
    prayer_items[i].children[2].textContent = format_relative(event.timestamp, current);
   }
  }

  tick_updates.push(update_schedule);
 })();

 (function menu(){
  const button_timeshift = $('menu-debug-timeshift');
  const icon_timeshift = $q('span', button_timeshift);

  $on($('menu-fullscreen'), 'click', () => {
   if (document.fullscreenElement) {
    document.exitFullscreen();
   } else {
    document.documentElement.requestFullscreen();
   }
  });

  $on(button_timeshift, 'click', () => {
   const is_active = button_timeshift.getAttribute('aria-pressed') === 'true';
   if (is_active) {
    tick_speed = tick_speed_regular;
    debug_time_override = null;
    button_timeshift.setAttribute('aria-pressed', 'false');
    icon_timeshift.textContent = button_timeshift.dataset.iconOff;
   } else {
    tick_speed = tick_speed_debug;
    debug_time_override = chrono.timestamp;
    button_timeshift.setAttribute('aria-pressed', 'true');
    icon_timeshift.textContent = button_timeshift.dataset.iconOn;
   }
  });
 })();

 (function debug_timeshift(){
  let is_dragging = false;
  let start_value = 0;
  let start_x = 0;

  $on(document.body, 'pointerdown', (e) => {
   if ($('menu-debug-timeshift').getAttribute('aria-pressed') !== 'true') return;
   is_dragging = true;
   start_value = debug_time_override;
   start_x = e.clientX;
   e.preventDefault();
  });

  $on(document, 'pointerup', () => {
   is_dragging = false;
  });

  $on(document, 'pointermove', (e) => {
   if (!is_dragging) return;
   const delta_ms = (e.clientX - start_x) * 60000;
   debug_time_override = start_value + delta_ms;
  });
 })();
</script>
