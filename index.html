<!DOCTYPE html>
<!--
Single Page HTML
by CatMeowByte

+ use 1 space indent
+ all boilerplate unindented
+ html contents inside <main> tag, body should be unmodified
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Internet</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="icon/material-icons.css">
</head>
<body>
<main>
 <form class="nav-bar">
  <button type="button" class="button" id="browser_back">
   <span class="material-icons">arrow_back</span>
  </button>
  <button type="button" class="button" id="browser_home">
   <span class="material-icons">home</span>
  </button>
  <input type="text" id="browser_address_bar">
  <button type="submit" class="button" id="browser_search">
   <span class="material-icons">search</span>
  </button>
 </form>
 <iframe id="content-frame" src="website/glimp.web/"></iframe>
</main>
<style>
 :root {
  --pal_black: #000000;
  --pal_white: #ffffff;
  --navbar_gap: 0.5rem;
  --vh: 1vh;
 }
 * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
 }
 main {
  width: 100vw;
  height: 100vh;
  height: calc(var(--vh) * 100);
  display: flex;
  flex-direction: column;
 }
 .nav-bar {
  display: flex;
  padding: var(--navbar_gap);
  gap: var(--navbar_gap);
  background: var(--pal_black);
 }
 .button {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  cursor: pointer;
  pointer-events: auto;
 }
 .button:hover,
 .button:active,
 .button:focus {
  background: transparent;
  outline: none;
 }
 .button .material-icons {
  color: var(--pal_white);
 }
 #browser_address_bar {
  flex: 1;
  background: var(--pal_white);
  color: var(--pal_black);
  border: none;
  padding: 4px 8px;
  border-radius: 0.25rem;
 }
 #content-frame {
  flex: 1;
  border: none;
 }
 .nav-bar.nav-bar-hidden {
  display: none;
 }
</style>
<script>
 const $ = sel => document.querySelector(sel);
 const $on = (el, ev, fn) => el.addEventListener(ev, fn);

 const home = 'glimp.web';
 const frame = $('#content-frame');
 const input = $('#browser_address_bar');
 const nav_form = $('.nav-bar');
 const button_home = $('#browser_home');
 const button_back = $('#browser_back');

 let current_url = '';
 let is_parent_load = false;

 const query_extract = url => {
  const i = url.indexOf('?');
  return i === -1 ? '' : url.slice(i);
 };

 const path_sanitize = url => {
  url = url.replace(/\?.*$/, '');
  url = url.replace(/^(web:\/\/|#\/)/, '');
  url = url.replace(/\/\/+/g, '/');
  if (url.endsWith('/')) url = url.slice(0, -1);
  url = url.replace(/\/index\.html$/, '');
  url = url.replace(/\/index$/, '');
  return url;
 };

 const path_to_src = path => {
  if (path === '') return 'website/' + home + '/index.html';
  const slash_index = path.indexOf('/');
  let domain, child;
  if (slash_index === -1) {
   domain = path;
   child = '';
  } else {
   domain = path.substring(0, slash_index);
   child = path.substring(slash_index + 1);
  }
  let src = 'website/' + domain;
  if (child === '' || !child.includes('.')) {
   src += (child ? '/' + child : '') + '/index.html';
  } else {
   src += '/' + child;
  }
  return src;
 };

 const sync = url => {
  current_url = url;
  input.value = 'web://' + url;
  history.replaceState(url, '', '#/' + url);
 };

 const navigate = url => {
  current_url = url;
  input.value = 'web://' + url;
  history.pushState(url, '', '#/' + url);
  is_parent_load = true;
  frame.src = path_to_src(path_sanitize(url)) + query_extract(url);
 };

 $on(frame, 'load', () => {
  try {
   const landed_url = path_sanitize(frame.contentWindow.location.pathname.replace(/^.*\/website\//, '')) + frame.contentWindow.location.search;
   if (is_parent_load) {
    is_parent_load = false;
    sync(landed_url);
   } else {
    current_url = landed_url;
    input.value = 'web://' + landed_url;
    history.pushState(landed_url, '', '#/' + landed_url);
   }

   const icon = frame.contentDocument.createElement('link');
   icon.rel = 'stylesheet';
   icon.href = new URL('icon/material-icons.css', window.location.href).href;
   frame.contentDocument.head.appendChild(icon);

   const font = frame.contentDocument.createElement('link');
   font.rel = 'stylesheet';
   font.href = new URL('font/font.css', window.location.href).href;
   frame.contentDocument.head.appendChild(font);

   const inject = frame.contentDocument.createElement('script');
   inject.src = new URL('inject.js', window.location.href).href;
   frame.contentDocument.head.appendChild(inject);
  } catch (e) {
   input.value = '[blocked]';
  }
 });

 $on(nav_form, 'submit', e => {
  e.preventDefault();
  navigate(path_sanitize(input.value) + query_extract(input.value));
 });

 $on(button_home, 'click', () => {
  navigate(home);
 });

 $on(button_back, 'click', () => {
  history.back();
 });

 $on(window, 'popstate', e => {
  const url = e.state ?? path_sanitize(location.hash) + query_extract(location.hash);
  current_url = url;
  input.value = 'web://' + url;
  is_parent_load = true;
  frame.src = path_to_src(path_sanitize(url)) + query_extract(url);
 });

 $on(window, 'message', e => {
  if (e.data.action === 'requestFullscreen') {
   nav_form.classList.add('nav-bar-hidden');
   document.documentElement.requestFullscreen();
   frame.contentWindow.postMessage({ action: 'fullscreenState', value: true }, '*');
  }
  if (e.data.action === 'exitFullscreen') {
   nav_form.classList.remove('nav-bar-hidden');
   document.exitFullscreen();
   frame.contentWindow.postMessage({ action: 'fullscreenState', value: false }, '*');
  }
  if (e.data.action === 'navigate') {
   const { url, domain, current_path } = e.data;
   navigate(
    url.startsWith('web://') ? path_sanitize(url) + query_extract(url) :
    url.startsWith('/') ? domain + url :
    domain + '/' + current_path.substring(0, current_path.lastIndexOf('/') + 1).replace(/^.*\/website\/[^\/]+\//, '') + url
   );
  }
  if (e.data.action === 'url_changed') {
   sync(path_sanitize(current_url) + e.data.query);
  }
 });

 is_parent_load = true;
 frame.src = location.hash
  ? path_to_src(path_sanitize(location.hash)) + query_extract(location.hash)
  : 'website/' + home + '/';

 const set_vh = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
 $on(window, 'resize', set_vh);
 set_vh();
</script>
</body>
</html>
